# Параметри прототипу. Змінні середовища IDS_DB_URL, IDS_MODELS_DIR, IDS_XGB_URL
# та IDS_AE_URL мають вищий пріоритет за значення з цього файлу.

# Пороги правила узгодження (3.1). Значення дібрано на валідаційній частині
# CICIDS2017; для іншої мережі їх потрібно відкалібрувати (train --calibrate).
thresholds:
  p1: 0.90          # верхній поріг оцінки XGBoost: впевнена атака
  p2: 0.30          # нижній поріг оцінки XGBoost: відсіювання норми
  tau1: 0.025       # верхній поріг похибки реконструкції автоенкодера
  tau2: 0.010       # нижній поріг похибки реконструкції автоенкодера
  tau_base: 0.0148  # поріг автоенкодера як окремого детектора

models_dir: models
db_url: sqlite:///data/alerts.db    # або postgresql://ids:ids@localhost:5432/hybrid_ids
correlation_window_s: 300           # вікно групування повторних оповіщень, с
